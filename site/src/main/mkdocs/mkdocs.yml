site_name: D5
site_description: D5 agiliza o desenvolvimento de aplicações web com DDD, arquitetura limpa, BDD, CQRS, programação defensiva, Spring Boot e Spring Data JPA.
site_author: Saulo Araujo
site_url: https://d5.sauloaraujo.dev
use_directory_urls: false

hooks:
  - hooks/exemplos.py

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/zoom-diagrama.js
  - javascripts/gerador.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight
  - pymdownx.snippets:
      base_path: ['.']
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

theme:
  name: material
  language: pt-BR
  features:
    - content.code.copy

nav:
  - Visão geral: index.md
  - Gerador: gerador.md
  - Tutorial:
      - Introdução: tutorial/index.md
      - Lição 1 - Unidade federativa: tutorial/1-unidade-federativa.md
      - Lição 2 - Município: tutorial/2-municipio.md
      - Lição 3 - Cliente: tutorial/3-cliente.md
  - Referência:
      - DDD: referencia/ddd.md
      - Arquitetura limpa: referencia/arquitetura-limpa.md
      - CQRS: referencia/cqrs.md
      - Convenções: referencia/convencoes.md
      - Framework:
          - Visão geral: referencia/framework/index.md
          - d5-framework-dominio: referencia/framework/dominio.md
          - d5-framework-aplicacao: referencia/framework/aplicacao.md
          - d5-framework-infraestrutura: referencia/framework/infraestrutura.md
          - d5-framework-ui-backend: referencia/framework/ui-backend.md
          - d5-framework-springdoc: referencia/framework/springdoc.md
          - Comportamentos automáticos: referencia/framework/comportamentos.md
      - Programação defensiva: referencia/programacao.md